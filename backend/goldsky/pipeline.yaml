# Goldsky Mirror pipeline — Mantle ERC-20 Transfer events for watched wallets.
# Deploy: goldsky pipeline apply --path backend/goldsky/pipeline.yaml
# Update addresses: edit the SQL WHERE clause below, then redeploy.
#
# NOTE: Native MNT transfers are NOT included (erc20_transfers only covers ERC-20 logs).
# Native MNT is tracked via direct RPC balance calls in tali-cli networth.

name: tali-mantle-erc20-transfers
resource_size: s
apiVersion: 3

sources:
  mantle_erc20_transfers:
    dataset_name: mantle.erc20_transfers
    version: 1.0.0
    type: dataset
    start_at: latest

transforms:
  watched_only:
    primary_key: id
    sql: >
      SELECT * FROM mantle_erc20_transfers
      WHERE sender    IN ('0x8a5b7bbaba77920744bd91643cc0e16a8acff061')
         OR recipient IN ('0x8a5b7bbaba77920744bd91643cc0e16a8acff061')

sinks:
  tali_webhook:
    type: webhook
    from: watched_only
    # URL is read from the TALI_WEBHOOK_URL secret stored in Goldsky.
    # To set it:
    #   goldsky secret upsert TALI_WEBHOOK_URL https://your-server.example.com/webhooks/goldsky
    # Local dev:   goldsky secret upsert TALI_WEBHOOK_URL https://xxx.ngrok-free.app/webhooks/goldsky
    # Production:  goldsky secret upsert TALI_WEBHOOK_URL https://your-railway-app.up.railway.app/webhooks/goldsky
    url: ${TALI_WEBHOOK_URL}
    # TALI_WEBHOOK_SECRET value is sent as the 'goldsky-webhook-secret' header on every delivery.
    # The value of this Goldsky secret must match GOLDSKY_WEBHOOK_SECRET in backend/.env.
    # To set it:  goldsky secret upsert TALI_WEBHOOK_SECRET <your-secret-value>
    secret_name: TALI_WEBHOOK_SECRET
    one_row_per_request: true
