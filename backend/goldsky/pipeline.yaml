# Goldsky Mirror pipeline — Mantle ERC-20 Transfer events for watched wallets.
# Deploy: goldsky pipeline apply --path backend/goldsky/pipeline.yaml
# Update addresses: edit the SQL WHERE clause below, then redeploy.
#
# NOTE: Native MNT transfers are NOT included (erc20_transfers only covers ERC-20 logs).
# Native MNT is tracked via direct RPC balance calls in tali-cli networth.

name: tali-mantle-erc20-transfers
resource_size: s
apiVersion: 3

sources:
  mantle_erc20_transfers:
    dataset_name: mantle.erc20_transfers
    version: 1.0.0
    type: dataset
    # 'latest' means only transfers after pipeline deployment are delivered.
    # Pre-deployment history is NOT backfilled. Historical balances are still
    # accurate via tali-cli networth (RPC balance query), just not in onchain_events.
    start_at: latest

transforms: {}

sinks:
  tali_webhook:
    type: webhook
    from: mantle_erc20_transfers
    # URL (with token) is injected at deploy time via envsubst — never hardcoded here.
    # TALI_WEBHOOK_URL must include the ?secret= query param, e.g.:
    #   https://xxx.ngrok-free.app/webhooks/goldsky?secret=<GOLDSKY_WEBHOOK_SECRET value>
    # Deploy with:
    #   TALI_WEBHOOK_URL="https://xxx.ngrok-free.app/webhooks/goldsky?secret=<your-secret>" \
    #     envsubst < backend/goldsky/pipeline.yaml | goldsky pipeline apply --path /dev/stdin
    url: ${TALI_WEBHOOK_URL}
    one_row_per_request: true
